# EXAMPLE ONLY: replace domain, certificate paths, and add infrastructure security controls.
# Internet -> HTTPS reverse proxy -> 127.0.0.1:8765 ONLY.
server {
    listen 80;
    server_name campus.example.edu;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name campus.example.edu;
    ssl_certificate /etc/letsencrypt/live/campus.example.edu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/campus.example.edu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    client_max_body_size 80k;
    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host campus.example.edu;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
